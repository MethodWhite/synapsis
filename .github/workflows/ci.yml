name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  checks: write
  statuses: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Check out sibling repos so [patch] overrides resolve correctly
      - name: Checkout synapsis-core
        uses: actions/checkout@v4
        with:
          repository: MethodWhite/synapsis-core
          path: ../synapsis-core
      - name: Checkout arca
        uses: actions/checkout@v4
        with:
          repository: MethodWhite/Arca
          path: ../arca

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test -- --test-threads=1
        env:
          RUST_BACKTRACE: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-${{ matrix.os }}
          path: /tmp/synapsis-test.log

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Checkout synapsis-core
        uses: actions/checkout@v4
        with:
          repository: MethodWhite/synapsis-core
          path: ../synapsis-core
      - name: Checkout arca
        uses: actions/checkout@v4
        with:
          repository: MethodWhite/Arca
          path: ../arca
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout synapsis-core
        uses: actions/checkout@v4
        with:
          repository: MethodWhite/synapsis-core
          path: ../synapsis-core
      - name: Checkout arca
        uses: actions/checkout@v4
        with:
          repository: MethodWhite/Arca
          path: ../arca
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy

  msrv:
    name: MSRV (1.95.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout synapsis-core
        uses: actions/checkout@v4
        with:
          repository: MethodWhite/synapsis-core
          path: ../synapsis-core
      - name: Checkout arca
        uses: actions/checkout@v4
        with:
          repository: MethodWhite/Arca
          path: ../arca
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check

  actionlint:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          level: warning

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check licenses and advisories
        run: cargo deny check

  secrets:
    name: Gitleaks (Secret Scanning)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  geiger:
    name: Cargo Geiger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Clean cargo cache
        run: cargo clean
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: Run geiger analysis
        run: |
          cargo geiger --output-format GitHub --update-readme || true
          cargo geiger --output-format Json > geiger-report.json || true
          cargo geiger --deny-warn --manifest-path Cargo.toml || true
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['rust']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  ci-status:
    name: ci
    if: always()
    needs: [test, fmt, clippy, msrv, actionlint, security, secrets, geiger, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const results = process.env.NEEDS_JSON;
            const parsed = JSON.parse(results);
            const allSuccess = Object.values(parsed).every(n => n.result === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: allSuccess ? 'success' : 'failure',
              context: 'ci',
              description: allSuccess ? 'All CI checks passed' : 'Some CI checks failed',
            });

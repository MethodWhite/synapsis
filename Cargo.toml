[package]
name = "synapsis"
version = "0.12.0"
edition = "2024"
authors = ["methodwhite"]
description = "Persistent memory engine for AI agents with PQC security"
license = "MIT"

[features]
default = []
pqc = ["synapsis-core/pqc", "ztf/pqc"]
db-encryption = ["rusqlite/sqlcipher"]
tui = ["dep:crossterm", "dep:ratatui"]
arca = ["dep:arca"]

[lib]
name = "synapsis"
path = "src/lib.rs"

[[bin]]
name = "synapsis"
path = "src/main.rs"

[[bin]]
name = "synapsis-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "synapsis-server"
path = "src/bin/server.rs"

[[bin]]
name = "synapsis-ollama"
path = "src/bin/ollama.rs"

[[bin]]
name = "synapsis-autoconfig"
path = "src/bin/autoconfig.rs"

[[bin]]
name = "synapsis-keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "synapsis-license-gen"
path = "src/bin/license_gen.rs"

[[bin]]
name = "synapsis-x402"
path = "src/bin/x402_server.rs"

[dependencies]
# Core library
synapsis-core = { git = "https://github.com/MethodWhite/synapsis-core", tag = "v0.9.0" }

# Arca wallet integration (--features arca for x402 payments)
arca = { git = "https://github.com/MethodWhite/Arca", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled", "blob", "serde_json"] }
dirs = "5.0"
anyhow = "1.0"
base64 = "0.22"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
uuid = { version = "1.0", features = ["v4", "fast-rng"] }

# Session ID
hostname = "0.4"
getrandom = "0.2"
ztf = { git = "https://github.com/MethodWhite/ztf", branch = "main", features = ["pqc"] }
audit-chain = { git = "https://github.com/MethodWhite/audit-chain", branch = "main", features = ["pqc"] }
rag-core = { git = "https://github.com/MethodWhite/rag-core", branch = "main" }
rag-agentic = { git = "https://github.com/MethodWhite/rag-agentic", branch = "main" }
sha1 = "0.10"
hex = "0.4"

# CLI
regex = "1"
url = "2"

# Async
tokio = { version = "1", features = ["full"] }

# Crypto
aes-gcm = "0.11"
hmac = "0.13"
sha2 = "0.11"
mdns-sd = "0.20"

# System monitoring
sysinfo = "0.39"

# QUIC transport
quinn = "0.11"
rustls = "0.23"
# PEM loading is built into rustls 0.23 via pki_types::PemObject
rcgen = "0.14"

# TUI (optional)
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }

[dev-dependencies]
proptest = "1.4"

# [patch] entries moved to .cargo/config.toml (generated by scripts/dev-setup.sh)
